<div id="city-quarter-layout">
  <div class="viz-controls">
    <label class="form-label" for="quarter-view">Новая планировка</label>
    <select class="form-select" id="quarter-view">
      <option value="routes">Проезды A / B / C</option>
      <option value="plan">Здания и дворы</option>
      <option value="doors">Входы и общие стены</option>
    </select>
  </div>
  <svg class="quarter-map" role="img" aria-label="Новая схема города: торговый квартал на западе, рынок на севере, сквозной жилой двор на востоке. Три подхода ведут к разным сторонам площади. Ратуша обращена входом на площадь; нижняя улица открыта."></svg>
  <div class="viz-row text-small" id="quarter-legend"></div>
  <div class="text-small" id="quarter-detail" aria-live="polite"></div>
</div>
<style>
#city-quarter-layout{display:grid;gap:calc(var(--font-size-base)*.7)}
#city-quarter-layout .quarter-map{display:block;width:100%;overflow:visible}
#city-quarter-layout .solid{fill:color-mix(in srgb,var(--foreground) 11%,var(--background));stroke:color-mix(in srgb,var(--foreground) 65%,var(--background));stroke-width:1.2;stroke-linejoin:round}
#city-quarter-layout .ridge{fill:none;stroke:color-mix(in srgb,var(--foreground) 25%,var(--background));stroke-width:1}
#city-quarter-layout .plaza{fill:color-mix(in srgb,var(--viz-series-1) 9%,var(--background));stroke:color-mix(in srgb,var(--foreground) 32%,var(--background));stroke-width:1}
#city-quarter-layout .court{fill:color-mix(in srgb,var(--foreground) 4%,var(--background));stroke:color-mix(in srgb,var(--foreground) 22%,var(--background));stroke-width:1}
#city-quarter-layout .paving{fill:none;stroke:color-mix(in srgb,var(--foreground) 13%,var(--background));stroke-width:1}
#city-quarter-layout .route{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
#city-quarter-layout .route-a{stroke:var(--viz-series-1)}
#city-quarter-layout .route-b{stroke:var(--viz-series-2)}
#city-quarter-layout .route-c{stroke:var(--viz-series-3)}
#city-quarter-layout .bypass{fill:none;stroke:var(--muted-foreground);stroke-width:1.6;stroke-dasharray:5 4;stroke-linecap:round}
#city-quarter-layout .entry{fill:none;stroke:var(--viz-series-1);stroke-width:4;stroke-linecap:round}
#city-quarter-layout text{fill:var(--foreground);font-family:inherit;font-weight:400;paint-order:stroke;stroke:var(--background);stroke-width:3;stroke-linejoin:round}
#city-quarter-layout .roof-label{stroke-width:0}
#city-quarter-layout .legend-dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.3em}
</style>
<script>
(()=>{
 const root=document.getElementById('city-quarter-layout');
 const svg=root.querySelector('svg'),select=root.querySelector('select'),legend=root.querySelector('#quarter-legend'),detail=root.querySelector('#quarter-detail');
 const ns='http://www.w3.org/2000/svg';
 const buildings=[
  {id:'trade',shape:[[4.8,2.4],[10.5,2.4],[10.5,4.8],[6.6,4.8],[6.6,6.8],[10.5,6.8],[10.5,8.6],[4.8,8.6]],roofs:[[[5.1,3.6],[10.2,3.6]],[[5.7,3.6],[5.7,7.7],[10.2,7.7]],[[7.5,2.4],[7.5,4.8]],[[8.9,6.8],[8.9,8.6]]]},
  {id:'southwest',shape:[[4.8,11.9],[7.8,11.9],[7.8,15.7],[4.8,15.7]],roofs:[[[6.3,12.2],[6.3,15.4]],[[4.8,13.6],[7.8,13.6]]]},
  {id:'market',shape:[[12.5,.5],[16.6,.5],[16.6,5.3],[14.5,5.3],[14.5,7],[12.5,7]],roofs:[[[14.55,.9],[14.55,4.95]],[[13.5,5.3],[13.5,6.7]]]},
  {id:'north-homes',shape:[[19.5,.5],[23.4,.5],[23.4,3],[19.5,3]],roofs:[[[19.8,1.75],[23.1,1.75]],[[21.4,.5],[21.4,3]]]},
  {id:'east-upper',shape:[[22.1,6],[27.8,6],[27.8,8.1],[24.1,8.1],[24.1,11],[18.9,11],[18.9,8.1],[22.1,8.1]],roofs:[[[22.45,7.05],[27.45,7.05]],[[21.5,8.45],[21.5,10.65]],[[22.1,9.55],[23.75,9.55]]]},
  {id:'east-main',shape:[[18.9,13],[25.1,13],[25.1,15.7],[18.9,15.7]],roofs:[[[19.25,14.35],[24.75,14.35]],[[22,13],[22,15.7]]]},
  {id:'townhall',shape:[[8.6,13.6],[11.8,13.6],[11.8,15.7],[8.6,15.7]],roofs:[[[8.95,14.65],[11.45,14.65]]]}
 ];
 const contextBuildings=[[0,2.2,1.3,5.1],[0,9,1.3,3.4],[0,13.8,1.3,1.9],[26.6,.5,1.4,3.5]];
 const doors=[
  {p:[[4.8,3.2],[4.8,3.9]],name:'Магазин: вход с широкой улицы'},
  {p:[[4.8,6.0],[4.8,6.6]],name:'Лавка: вход с улицы'},
  {p:[[8.7,8.6],[9.4,8.6]],name:'Лавка: вход со стороны площади'},
  {p:[[8.3,4.8],[9.1,4.8]],name:'Служебная дверь к разгрузочному двору'},
  {p:[[6.6,5.2],[6.6,5.8]],name:'Склад: вход во двор'},
  {p:[[7.8,12.2],[7.8,12.8]],name:'Жилой дом: вход с боковой улицы'},
  {p:[[4.8,14.4],[4.8,15]],name:'Жилой дом: вход с западной улицы'},
  {p:[[16.6,3.7],[16.6,4.5]],name:'Рынок: главный вход'},
  {p:[[14.5,5.85],[14.5,6.5]],name:'Рынок: служебный вход'},
  {p:[[20.2,3],[20.8,3]],name:'Северный жилой ряд: вход с улицы'},
  {p:[[22.2,3],[22.8,3]],name:'Северный жилой ряд: отдельный вход'},
  {p:[[24.1,9.4],[24.1,10.1]],name:'Жилой флигель: вход во двор'},
  {p:[[25.6,8.1],[26.3,8.1]],name:'Северный флигель: вход во двор'},
  {p:[[21.0,13],[21.7,13]],name:'Жилой дом: вход во двор'},
  {p:[[24,13],[24.7,13]],name:'Жилой дом: вход во двор'},
  {p:[[24,15.7],[24.7,15.7]],name:'Жилой дом: вход с нижней улицы'},
  {p:[[9.6,13.6],[10.8,13.6]],name:'Ратуша: главный вход на площадь'},
  {p:[[1.3,4.1],[1.3,4.7]],name:'Дом за краем карты: уличный вход'},
  {p:[[1.3,10.2],[1.3,10.8]],name:'Дом за краем карты: уличный вход'},
  {p:[[1.3,14.3],[1.3,14.9]],name:'Дом за краем карты: уличный вход'},
  {p:[[26.6,2],[26.6,2.6]],name:'Дом за краем карты: уличный вход'}
 ];
 const routes={A:[[3,1.8],[3,10.5],[10.2,10.5],[12.5,12]],B:[[25,1.8],[25,4.9],[18,4.9],[18,9.4],[14.4,9.4],[14.4,11.4]],C:[[26.5,9.5],[25.8,9.5],[25.8,12],[17,12]]};
 const saved=window.openai?.widgetState?.modelContent?.view;
 if(['plan','routes','doors'].includes(saved))select.value=saved;
 function render(){
  const w=Math.max(280,root.clientWidth),margin=10,s=(w-margin*2)/28,h=18*s+margin*2,wide=w>=560;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('height',String(h));svg.replaceChildren();
  const point=([x,y])=>[margin+x*s,margin+y*s];
  const add=(tag,attrs)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));svg.append(e);return e;};
  const path=(pts,cls,closed=false)=>add('path',{class:cls,d:pts.map((p,i)=>(i?'L':'M')+point(p).join(',')).join(' ')+(closed?' Z':'')});
  const rect=(x,y,rw,rh,cls)=>path([[x,y],[x+rw,y],[x+rw,y+rh],[x,y+rh]],cls,true);
  const label=(text,x,y,small=false,roof=false)=>{const [px,py]=point([x,y]);const e=add('text',{x:px,y:py,'text-anchor':'middle','dominant-baseline':'middle',class:[small?'text-small':'',roof?'roof-label':''].join(' ')});e.textContent=text;return e;};
  rect(0,16,28,2,'court');
  rect(9,10.3,9.9,5.5,'plaza');
  rect(6.6,4.8,3.9,2,'court');
  path([[24.1,8.1],[27.8,8.1],[27.8,13],[18.9,13],[18.9,11],[24.1,11]],'court',true);
  for(let x=9.4;x<18.7;x+=.8)path([[x,10.7],[x,15.4]],'paving');
  for(let y=10.7;y<15.7;y+=.8)path([[9.4,y],[18.5,y]],'paving');
  buildings.forEach(b=>{const e=path(b.shape,'solid',true);e.setAttribute('data-building',b.id);b.roofs.forEach(r=>path(r,'ridge'));});
  contextBuildings.forEach(([x,y,bw,bh])=>{rect(x,y,bw,bh,'solid');path([[x+bw*.5,y+.2],[x+bw*.5,y+bh-.2]],'ridge');});
  rect(9.75,14.2,.9,.9,'court');
  // A visible open threshold, never an arch across the driving gap.
  path([[18.95,11.05],[20.2,11.05]],'ridge');path([[18.95,12.95],[20.2,12.95]],'ridge');
  if(select.value==='routes'){
   path([[3,9.5],[18,9.5]],'bypass');
   path([[.4,17.2],[27.6,17.2]],'bypass');
   path([[25.8,11.4],[26.4,11.4],[26.4,17.2]],'bypass');
   Object.entries(routes).forEach(([name,pts])=>{
    const cls='route route-'+name.toLowerCase();path(pts,cls);
    const a=pts.at(-2),b=pts.at(-1),dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
    path([[b[0]-.35*ux+.19*uy,b[1]-.35*uy-.19*ux],b,[b[0]-.35*ux-.19*uy,b[1]-.35*uy+.19*ux]],cls);
   });
  }
  if(select.value==='doors')doors.forEach(d=>path(d.p,'entry').setAttribute('data-tooltip',d.name));
  // The civic entrance remains visible in every layer.
  path([[9.6,13.6],[10.8,13.6]],'entry');
  label('A',3,1.0);label('B',25,1.0);label('C',27.2,9.5);
  label(wide?'Лавки':'1',7.65,3.55,true,true);
  label(wide?'Рынок':'2',14.55,2.5,true,true);
  label(wide?'Жилой ряд':'',21.45,1.75,true,true);
  label(wide?'Разгрузка':'',8.55,5.75,true);
  label(wide?'Флигель':'',25,7.05,true,true);
  label(wide?'Жилой дом':'3',21.5,9.55,true,true);
  label(wide?'Жилой ряд':'',22,14.35,true,true);
  label(wide?'Двор':'',25.7,8.75,true);
  label(wide?'Площадь':'Площадь',16.1,15.1, !wide);
  label(wide?'Ратуша':'4',10.2,15.15,true,true);
  rect(13.1,12.6,1.8,1.8,'solid');label(wide?'База':'Б',14,13.5,true,true);
  const [rx,ry]=point([16.4,17.2]);add('circle',{cx:rx,cy:ry,r:.53*s,fill:'var(--background)',stroke:'var(--viz-series-1)','stroke-width':2});
  label('Возврат',wide?19.5:21,17.2,true);
  legend.replaceChildren();
  if(select.value==='routes'){
   [['A — широкая улица',1],['B — обход рынка',2],['C — сквозной двор',3]].forEach(([name,n])=>{const item=document.createElement('span');const dot=document.createElement('i');dot.className='legend-dot';dot.style.background=`var(--viz-series-${n})`;dot.setAttribute('aria-hidden','true');item.append(dot,document.createTextNode(name));legend.append(item);});
  }else if(!wide){legend.textContent='1 — лавки · 2 — рынок · 3 — жилой квартал · 4 — ратуша';}
  else{legend.textContent=select.value==='doors'?'Отметки — входы; на общих стенах проёмов нет.':'Общий контур — связанная застройка; тонкие линии — крыши и разделение домов.';}
  detail.textContent=select.value==='routes'?'Пунктир — переулок, южный выход из двора и открытая нижняя улица.':select.value==='doors'?'Служебные двери связаны с дворами; главный вход ратуши обращён на площадь.':'Предложение по планировке; окончательные размеры и боевой баланс ещё не проверены.';
 }
 select.addEventListener('change',()=>{render();window.openai?.setWidgetState({modelContent:{view:select.value},privateContent:null}).catch(()=>{});});
 window.addEventListener('openai:set_globals',e=>{const view=e.detail?.globals?.widgetState?.modelContent?.view;if(['plan','routes','doors'].includes(view)){select.value=view;render();}});
 new ResizeObserver(render).observe(root);render();
})();
</script>
